<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1312 Wrap Design — баннер</title>
<style>
@font-face { font-family: 'Outfit'; font-style: normal; font-weight: 800; font-display: swap; src: url('fonts/Outfit-ExtraBold-latin.woff2') format('woff2'); }

:root {
  --black: #040407; --blue: #38b6ff; --blue-deep: #3f7fd6; --purple: #a35bd6; --magenta: #8a1580;
  --display: 'Outfit', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: transparent; }
body { font-family: var(--text); -webkit-font-smoothing: antialiased; }

/* ── баннер: высота как у баннера в программе ── */
.wrap { container-type: inline-size; width: 100%; }
.bn { --copy-w: clamp(300px, 39cqw, 540px); --also-w: clamp(124px, 11cqw, 160px); position: relative; height: var(--h, 156px); border-radius: 20px; overflow: hidden; background: var(--black); border: 1px solid rgba(163, 91, 214, .35); color: #fff; isolation: isolate; }
html.embed .bn { --h: 100vh; }

.bg, .bg > * { position: absolute; pointer-events: none; }
.bg { inset: 0; z-index: -1; }
.glow { border-radius: 50%; filter: blur(42px); opacity: .5; animation: glow 13s ease-in-out infinite alternate; }
.g1 { width: 290px; height: 200px; left: -70px; top: -90px; background: var(--blue-deep); }
.g2 { width: 320px; height: 210px; left: 44%; top: 34px; background: var(--purple); animation-duration: 16s; }
.g3 { width: 250px; height: 180px; right: -50px; top: -70px; background: var(--magenta); animation-duration: 11s; }
@keyframes glow { to { transform: translate(36px, 14px) scale(1.15); } }
.grid { inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(ellipse 55% 90% at 62% 50%, #000, transparent 80%); mask-image: radial-gradient(ellipse 55% 90% at 62% 50%, #000, transparent 80%); }
.road { left: 0; right: 0; bottom: 0; height: 26px; opacity: .45; background: repeating-linear-gradient(90deg, transparent 0 70px, rgba(56, 182, 255, .3) 70px 150px, transparent 150px 240px) 0 8px / 240px 2px repeat-x, repeating-linear-gradient(90deg, transparent 0 40px, rgba(255, 255, 255, .16) 40px 70px, transparent 70px 130px) 0 18px / 130px 2px repeat-x; animation: road .8s linear infinite; -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 30%, #000 85%, transparent); }
@keyframes road { to { background-position: -240px 8px, -130px 18px; } }

/* слайды */
.slide { position: absolute; inset: 0; visibility: hidden; }
.slide.on, .slide.off { visibility: visible; }
.slide.off { z-index: 0; } .slide.on { z-index: 1; }

.stage { position: absolute; top: 0; bottom: 0; left: calc(var(--copy-w) + 44px); right: var(--also-w); pointer-events: none; }
.stage::before { content: ''; position: absolute; left: 10%; right: 0; top: 0; bottom: 0; background: radial-gradient(closest-side, color-mix(in srgb, var(--c1) 30%, transparent), transparent); opacity: 0; }

/* название проекта вертикально у левого края сцены */
.proj { position: absolute; left: 2px; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; display: flex; align-items: center; gap: 8px; font: 800 8.5px/1 var(--text); letter-spacing: .34em; text-transform: uppercase; white-space: nowrap; color: rgba(255, 255, 255, .5); opacity: 0; }
.proj::after { content: ''; width: 1px; height: 18px; background: linear-gradient(180deg, var(--c1), transparent); }

.big { position: absolute; left: 0; top: 4px; font: 800 128px/.78 var(--display); letter-spacing: -.045em; color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, .16); background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 82%); -webkit-background-clip: text; background-clip: text; opacity: 0; user-select: none; }

.band { position: absolute; right: 10%; top: 12%; width: 30%; height: 76%; transform: skewX(-20deg); border-radius: 5px; opacity: 0; overflow: hidden; background: linear-gradient(120deg, var(--c1), var(--c2)); -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent 100%); mask-image: linear-gradient(180deg, #000 45%, transparent 100%); }
.band::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 255, 255, .32) 1.1px, transparent 1.6px) 0 0 / 7px 7px; -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000); mask-image: linear-gradient(90deg, transparent 20%, #000); }
.band::after { content: ''; position: absolute; top: 0; bottom: 0; left: -26%; width: 12%; background: var(--c1); box-shadow: 0 0 0 4px var(--black); }

.streaks i { position: absolute; left: 0; height: 2px; border-radius: 2px; opacity: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent); }
.streaks i:nth-child(1) { top: 26%; width: 46%; }
.streaks i:nth-child(2) { top: 44%; width: 62%; background: linear-gradient(90deg, transparent, var(--c1), transparent); }
.streaks i:nth-child(3) { top: 60%; width: 38%; }
.streaks i:nth-child(4) { top: 72%; width: 54%; background: linear-gradient(90deg, transparent, var(--c2), transparent); }

/* машина: почти во всю высоту баннера, стоит у нижнего края, над крышей остаётся воздух */
.car { --ch: calc(var(--h, 156px) - 22px); position: absolute; left: 50%; bottom: 7px; width: min(calc(var(--ch) * var(--ar)), calc(100% - 32px)); aspect-ratio: var(--ar); transform: translateX(-50%); }
html.embed .car { --ch: calc(100vh - 22px); }
.car img { display: block; -webkit-user-drag: none; user-select: none; }
.car .outline { position: absolute; inset: 0; width: 100%; height: 100%; filter: url(#outline); opacity: 0; }
.body { position: absolute; inset: 0; opacity: 0; }
.body > img { position: absolute; inset: 0; width: 100%; height: 100%; }
.body::after { content: ''; position: absolute; left: 5%; right: 5%; bottom: -5px; height: 11px; z-index: -1; background: radial-gradient(closest-side, rgba(0, 0, 0, .85), transparent); }
.sheen { position: absolute; inset: 0; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, .55) 50%, transparent 58%) 100% 0 / 300% 100% no-repeat; opacity: 0; }

/* до и после: сам двигается, мышью не управляется */
.compare .stock { left: -1.4335%; top: -4.2632%; width: 103.017%; height: 108.823%; }
.compare .design { clip-path: inset(0 calc(100% - var(--pos, 0%)) 0 0); }
.cmp-line { position: absolute; top: -2%; bottom: -2%; left: var(--pos, 0%); width: 2px; margin-left: -1px; background: linear-gradient(180deg, transparent, #fff 14%, #fff 86%, transparent); box-shadow: 0 0 10px var(--blue), 0 0 22px var(--purple); opacity: 0; transition: opacity .3s; }
.cmp-knob { position: absolute; top: 46%; left: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%; background: rgba(10, 10, 16, .55); border: 1.5px solid rgba(255, 255, 255, .85); backdrop-filter: blur(6px); box-shadow: 0 0 14px rgba(56, 182, 255, .6); }
.cmp-knob svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cmp-tag { position: absolute; top: 0; padding: 3px 7px; border-radius: 999px; font: 800 8.5px/1 var(--text); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; background: rgba(10, 10, 16, .55); border: 1px solid rgba(255, 255, 255, .18); backdrop-filter: blur(6px); opacity: 0; transition: opacity .3s; }
.cmp-tag.l { left: 2%; background: color-mix(in srgb, var(--c1) 40%, rgba(10, 10, 16, .6)); border-color: color-mix(in srgb, var(--c1) 70%, transparent); }
.cmp-tag.r { right: 2%; }
.compare.live .cmp-line, .compare.live .cmp-tag { opacity: 1; }

/* текст */
/* текст растёт вместе с шириной баннера */
.copy { position: absolute; left: 24px; top: 11px; width: var(--copy-w); z-index: 2; }
.kicker { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.kicker b { font: 800 clamp(9.5px, .92cqw, 11px)/1 var(--text); letter-spacing: .26em; text-transform: uppercase; color: var(--blue); white-space: nowrap; }
.chip { font: 700 clamp(9px, .84cqw, 10px)/1 var(--text); letter-spacing: .12em; text-transform: uppercase; padding: 3.5px 7px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--c1) 24%, transparent); border: 1px solid color-mix(in srgb, var(--c1) 50%, transparent); }
.head { font: 800 clamp(20px, 2.75cqw, 31px)/1.04 var(--display); letter-spacing: -.02em; white-space: nowrap; }
.head span { background: linear-gradient(90deg, #fff 0%, #fff 35%, var(--blue) 50%, #fff 65%, #fff 100%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5.5s ease-in-out infinite; }
@keyframes shine { 0%, 45% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.head em { position: relative; display: inline-block; font-style: normal; margin-left: .08em; padding: .02em .28em .05em; border-radius: .32em; background: linear-gradient(135deg, var(--purple), var(--magenta)); box-shadow: 0 5px 16px rgba(163, 91, 214, .45), inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .22); transform: rotate(-3deg); }
.head em::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255, 255, 255, .26), transparent 55%); }
.head em b { position: relative; font: inherit; }
.spark { position: absolute; right: -.62em; top: -.14em; width: .62em; height: .62em; fill: #fff; filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px var(--purple)); animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { transform: scale(.75) rotate(0); opacity: .75; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
.sub { margin-top: 4px; font-size: clamp(11.5px, 1.18cqw, 13px); line-height: 1.3; color: rgba(255, 255, 255, .72); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* кнопки */
.cta { position: absolute; left: 24px; bottom: 10px; z-index: 3; display: flex; align-items: center; gap: 14px; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 10px; background: linear-gradient(135deg, #38b6ff, #a35bd6 60%, #8a1580); color: #fff; font-weight: 800; font-size: 12.5px; text-decoration: none; white-space: nowrap; box-shadow: 0 6px 20px rgba(163, 91, 214, .45); transition: transform .15s, box-shadow .15s; }
.btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .45) 50%, transparent 60%) 100% 0 / 300% 100% no-repeat; animation: btnSheen 4.5s ease-in-out infinite; }
@keyframes btnSheen { 0%, 70% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(56, 182, 255, .5); }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.lnk { color: rgba(255, 255, 255, .75); font-size: 12px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.lnk:hover { color: #fff; } .lnk svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* другие услуги: ровная колонка, плывёт вверх */
.also { position: absolute; top: 0; right: 0; bottom: 0; width: var(--also-w); overflow: hidden; pointer-events: none; -webkit-mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent); mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent); }
.also::before { content: ''; position: absolute; left: 0; top: 12%; bottom: 12%; width: 1px; background: linear-gradient(180deg, transparent, rgba(163, 91, 214, .55), transparent); }
.also-track { display: flex; flex-direction: column; align-items: center; animation: drift 15s linear infinite; }
.also-track span { display: flex; flex-direction: column; align-items: center; gap: 9px; padding-bottom: 9px; font: 800 clamp(13px, 1.25cqw, 15.5px)/1 var(--display); letter-spacing: .01em; text-align: center; white-space: nowrap; color: transparent; background: linear-gradient(90deg, #e2cbff, #b98cf0); -webkit-background-clip: text; background-clip: text; }
.also-track span::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: rgba(163, 91, 214, .7); }
@keyframes drift { to { transform: translateY(-50%); } }

/* ── анимация ── */
.on .stage::before { animation: fade 1.2s .2s ease both; }
.on .big { animation: bigIn 8s cubic-bezier(.2, .7, .2, 1) both; }
.on .band { animation: bandIn .8s .15s cubic-bezier(.2, .8, .2, 1) both; }
.on .streaks i { animation: streak .9s cubic-bezier(.3, .6, .4, 1) both; }
.on .streaks i:nth-child(1) { animation-delay: .35s; } .on .streaks i:nth-child(2) { animation-delay: .43s; } .on .streaks i:nth-child(3) { animation-delay: .55s; } .on .streaks i:nth-child(4) { animation-delay: .49s; }
.on .outline { animation: draw 1.7s ease both; }
.on .proj { animation: fade .8s 1.2s ease both; }
.on .body { animation: carIn 1s .5s cubic-bezier(.16, .84, .3, 1) both; }
.on .sheen { animation: sheen 1.1s var(--sheen-d, 1.6s) ease-in-out both; }
.on .copy > * { animation: copyIn .6s cubic-bezier(.2, .8, .2, 1) both; }
.on .kicker { animation-delay: .35s !important; } .on .head { animation-delay: .48s !important; } .on .sub { animation-delay: .62s !important; }
.on .head em { animation: pop .75s .9s cubic-bezier(.3, 1.6, .5, 1) both; }

.off .body { animation: carOut .55s cubic-bezier(.6, 0, .9, .4) both; }
.off .copy, .off .band, .off .big, .off .proj, .off .stage::before { animation: fadeOut .4s ease both; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes bigIn { 0% { opacity: 0; transform: translateX(12%); } 12% { opacity: 1; } 100% { opacity: 1; transform: translateX(-4%); } }
@keyframes bandIn { 0% { opacity: 0; transform: skewX(-20deg) translateX(60%); } 100% { opacity: .9; transform: skewX(-20deg); } }
@keyframes streak { 0% { opacity: 0; transform: translateX(170%); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateX(-110%); } }
@keyframes draw { 0% { opacity: 1; clip-path: inset(0 100% 0 0); } 35% { opacity: 1; clip-path: inset(0 0 0 0); } 70% { opacity: .85; } 100% { opacity: 0; clip-path: inset(0 0 0 0); } }
@keyframes carIn { 0% { opacity: 0; transform: translateX(60%); filter: blur(7px); } 35% { opacity: 1; } 65% { transform: translateX(-1.6%); filter: blur(0); } 82% { transform: translateX(.5%); } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes carOut { 0% { opacity: 1; transform: none; filter: none; } 100% { opacity: 0; transform: translateX(-80%); filter: blur(8px); } }
@keyframes sheen { 0% { opacity: 1; background-position: 100% 0; } 100% { opacity: 1; background-position: 0 0; } }
@keyframes copyIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: rotate(8deg) scale(.3); } 60% { opacity: 1; transform: rotate(-6deg) scale(1.1); } 100% { opacity: 1; transform: rotate(-3deg) scale(1); } }

/* ── ширина ── */
@container (max-width: 940px) { .bn { --also-w: 0px; } .also { display: none; } }
@container (max-width: 760px) { .big { font-size: 104px; } .proj { display: none; } .car { width: min(calc(var(--ch) * var(--ar)), calc(100% - 8px)); } }
@container (max-width: 600px) { .stage { display: none; } .bn { --copy-w: calc(100cqw - 48px); } }

@media (prefers-reduced-motion: reduce) {
  .bn *, .bn *::before, .bn *::after { animation: none !important; transition: none !important; }
  .slide.on .body, .slide.on .big, .slide.on .proj, .slide.on .stage::before { opacity: 1; }
  .slide.on .band { opacity: .9; }
  .slide.off { visibility: hidden; }
}

/* ── предпросмотр (только когда файл открыт сам по себе) ── */
.pv { display: none; }
html:not(.embed) body { min-height: 100vh; padding: 28px 24px 40px; background: var(--page, #0B0C10); color: var(--page-ink, #F2F3F6); transition: background .2s; }
html:not(.embed) .pv { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: max(var(--pw, 1100px), 760px); margin: 0 auto 18px; font-size: 12.5px; }
html:not(.embed) .wrap { max-width: var(--pw, 1100px); margin: 0 auto; }
html.light { --page: #F2F3F7; --page-ink: #14151A; }
.pv h1 { font: 800 15px/1.2 var(--display); margin-right: auto; }
.pv h1 small { display: block; font: 500 12px/1.4 var(--text); opacity: .6; margin-top: 3px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: rgba(127, 127, 140, .16); }
.seg button { border: 0; background: none; color: inherit; font: 700 12px/1 var(--text); padding: 7px 11px; border-radius: 8px; cursor: pointer; opacity: .7; }
.seg button.active { background: rgba(127, 127, 140, .28); opacity: 1; }
</style>
</head>
<body>
<div class="pv" id="pv">
  <h1>Баннер 1312 Wrap Design <small>Предпросмотр. В программе язык меняется сам, вместе с языком приложения.</small></h1>
  <div class="seg" data-g="lang"><button data-v="en">ENG</button><button data-v="uk">UKR</button><button data-v="ru">RU</button></div>
  <div class="seg" data-g="bg"><button data-v="dark">Тёмная тема</button><button data-v="light">Светлая</button></div>
  <div class="seg" data-g="w"><button data-v="1400">1400</button><button data-v="1100">1100</button><button data-v="900">900</button><button data-v="740">740</button></div>
</div>

<div class="wrap">
  <div class="bn" id="bn" role="region" data-ta="aria-label:region">
    <div class="bg" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span><span class="grid"></span><span class="road"></span></div>

    <!-- 1. Ranger: голый кузов → дизайн -->
    <section class="slide" style="--c1: #ff6a1c; --c2: #0f9a8f; --sheen-d: 6.1s">
      <div class="stage">
        <span class="big" aria-hidden="true">1312</span><span class="band" aria-hidden="true"></span><span class="streaks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="proj" aria-hidden="true">UKR AGRO CENTR</span>
        <div class="car compare" id="cmp" style="--ar: 2000 / 673" role="img" data-ta="aria-label:cmp">
          <img class="outline stock" src="img/ranger-stock.webp" alt="" style="position: absolute">
          <div class="body">
            <img class="stock" src="img/ranger-stock.webp" alt="">
            <img class="design" src="img/ranger-design.webp" alt="">
            <span class="sheen" style="--m: url(img/ranger-design.webp)"></span>
          </div>
          <span class="cmp-line"><span class="cmp-knob"><svg viewBox="0 0 24 24"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></span></span>
          <span class="cmp-tag l" data-t="ours"></span><span class="cmp-tag r" data-t="stock"></span>
        </div>
      </div>
      <div class="copy">
        <div class="kicker"><b>1312 Wrap Design</b><span class="chip" data-t="s1c"></span></div>
        <h2 class="head"><span data-t="s1a"></span> <em><b data-t="s1b"></b><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0Z"/></svg></em></h2>
        <p class="sub" data-t="s1p"></p>
      </div>
    </section>

    <!-- 2. OBMIFY -->
    <section class="slide" style="--c1: #8b5cf6; --c2: #f2b40c">
      <div class="stage" aria-hidden="true">
        <span class="big">1312</span><span class="band"></span><span class="streaks"><i></i><i></i><i></i><i></i></span>
        <span class="proj">OBMIFY</span>
        <div class="car" style="--ar: 2000 / 577">
          <img class="outline" src="img/obmify.webp" alt="">
          <div class="body"><img src="img/obmify.webp" alt=""><span class="sheen" style="--m: url(img/obmify.webp)"></span></div>
        </div>
      </div>
      <div class="copy">
        <div class="kicker"><b>1312 Wrap Design</b><span class="chip" data-t="s2c"></span></div>
        <h2 class="head"><span data-t="s2a"></span> <em><b data-t="s2b"></b><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0Z"/></svg></em></h2>
        <p class="sub" data-t="s2p"></p>
      </div>
    </section>

    <!-- 3. BMW E30 Crazy Cars -->
    <section class="slide" style="--c1: #ff2fa8; --c2: #1fb6f0">
      <div class="stage" aria-hidden="true">
        <span class="big">1312</span><span class="band"></span><span class="streaks"><i></i><i></i><i></i><i></i></span>
        <span class="proj">CRAZY CARS</span>
        <div class="car" style="--ar: 2000 / 596">
          <img class="outline" src="img/crazy-cars.webp" alt="">
          <div class="body"><img src="img/crazy-cars.webp" alt=""><span class="sheen" style="--m: url(img/crazy-cars.webp)"></span></div>
        </div>
      </div>
      <div class="copy">
        <div class="kicker"><b>1312 Wrap Design</b><span class="chip" data-t="s3c"></span></div>
        <h2 class="head"><span data-t="s3a"></span> <em><b data-t="s3b"></b><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0Z"/></svg></em></h2>
        <p class="sub" data-t="s3p"></p>
      </div>

    <div class="cta">
      <a class="btn" href="https://www.instagram.com/1312.wrap.design/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg><span data-t="cta"></span></a>
      <a class="lnk" href="https://1312wrap.dev/" target="_blank" rel="noopener"><span data-t="site"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </div>
    <div class="also" aria-hidden="true"><div class="also-track" id="also"></div></div>
  </div>
</div>

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <filter id="outline" x="-2%" y="-4%" width="104%" height="108%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="1.2" result="wide"/>
    <feComposite in="wide" in2="SourceAlpha" operator="out" result="ring"/>
    <feFlood flood-color="#38b6ff"/>
    <feComposite in2="ring" operator="in" result="edge"/>
    <feGaussianBlur in="edge" stdDeviation="2.5" result="soft"/>
    <feMerge><feMergeNode in="soft"/><feMergeNode in="edge"/></feMerge>
  </filter>
</svg>

<script>
(() => {
  // Новый язык — новый блок с теми же ключами.
  const T = {
    en: {
      region: '1312 Wrap Design studio', cmp: 'Ford Ranger before and after the UKR AGRO CENTR livery',
      s1c: 'for business', s1a: 'Design', s1b: 'for business', s1p: 'Think bigger: we’ll make your commercial vehicle bright and unique.',
      s2c: 'full service', s2a: 'From idea', s2b: 'to reality', s2p: 'We design from scratch around the client’s wishes and goals.',
      s3c: 'for motorsport', s3a: 'Race', s3b: 'livery', s3p: 'We’ll make your race car stand out in the paddock and catch the crowd’s eye.',
      stock: 'Stock', ours: 'Our design', cta: 'Message us', site: 'Our website',
      also: ['Branding', 'Logos', 'Merch', 'Websites', 'Apps']
    },
    uk: {
      region: 'Студія 1312 Wrap Design', cmp: 'Ford Ranger до і після лівреї UKR AGRO CENTR',
      s1c: 'для бізнесу', s1a: 'Дизайн', s1b: 'для бізнесу', s1p: 'Пропонуємо мислити ширше, зробимо комерційне авто яскравим і унікальним.',
      s2c: 'під ключ', s2a: 'Від ідеї', s2b: 'до реалізації', s2p: 'Розробимо дизайн з нуля з урахуванням побажань і цілей клієнта.',
      s3c: 'для автоспорту', s3a: 'Спортивна', s3b: 'ліврея', s3p: 'Виділимо ваше спортивне авто в техпарку й не залишимо без уваги глядачів.',
      stock: 'Сток', ours: 'Наш дизайн', cta: 'Напишіть нам', site: 'Наш сайт',
      also: ['Брендинг', 'Логотипи', 'Мерч', 'Сайти', 'Застосунки']
    },
    ru: {
      region: 'Студия 1312 Wrap Design', cmp: 'Ford Ranger до и после ливреи UKR AGRO CENTR',
      s1c: 'для бизнеса', s1a: 'Дизайн', s1b: 'для бизнеса', s1p: 'Предлагаем мыслить шире, сделаем коммерческий автомобиль ярким и уникальным.',
      s2c: 'под ключ', s2a: 'От идеи', s2b: 'до реализации', s2p: 'Разработаем дизайн с нуля, исходя из пожеланий и целей клиента.',
      s3c: 'для автоспорта', s3a: 'Спортивная', s3b: 'ливрея', s3p: 'Выделим ваше спортивное авто в техпарке и не оставим без внимания зрителей.',
      stock: 'Сток', ours: 'Наш дизайн', cta: 'Напишите нам', site: 'Наш сайт',
      also: ['Брендинг', 'Логотипы', 'Мерч', 'Сайты', 'Приложения']
    }
  };
  const LANGS = Object.keys(T);
  const root = document.documentElement;
  let embedded = false;
  try { embedded = window.parent !== window; } catch (e) { embedded = true; }
  root.classList.toggle('embed', embedded);

  // Язык: ?lang=uk в адресе, потом сообщение {type: 'lang', lang: 'ru'} от программы.
  const q = new URLSearchParams(location.search).get('lang');
  const nav = (navigator.language || 'en').slice(0, 2);
  let lang = LANGS.includes(q) ? q : LANGS.includes(nav) ? nav : 'en';

  function setLang(l) {
    if (!LANGS.includes(l)) return;
    lang = l; root.lang = l;
    const t = T[l];
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll('[data-ta]').forEach(el => { const [attr, key] = el.dataset.ta.split(':'); el.setAttribute(attr, t[key]); });
    const also = document.getElementById('also');
    also.textContent = '';
    for (let r = 0; r < 2; r++) t.also.forEach(w => { const s = document.createElement('span'); s.textContent = w; also.append(s); });
    mark('lang', l);
  }
  window.addEventListener('message', e => { const d = e.data; if (d && typeof d === 'object' && d.type === 'lang') setLang(d.lang); });
  window.setBannerLang = setLang;

  // Слайды идут по кругу: Ranger → OBMIFY → 450 GROUP.
  const bn = document.getElementById('bn');
  const slides = [...bn.querySelectorAll('.slide')];
  const DUR = [8100, 7000, 7000];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const offTimers = [];
  let cur = -1, t = 0, last = performance.now();

  function go(i) {
    const prev = slides[cur];
    if (prev) {
      prev.classList.remove('on'); void prev.offsetWidth; prev.classList.add('off');
      clearTimeout(offTimers[cur]);
      const pi = cur; offTimers[pi] = setTimeout(() => slides[pi].classList.remove('off'), 650);
    }
    cur = i; t = 0;
    const s = slides[i];
    clearTimeout(offTimers[i]); s.classList.remove('off'); void s.offsetWidth; s.classList.add('on');
  }

  // До и после на Ranger: выезжает голый кузов, линия раскрывает дизайн, отходит на 70 %,
  // снова раскрывает дизайн и исчезает; машина стоит ещё 2 секунды.
  const cmp = document.getElementById('cmp');
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const KEYS = [[0, 0], [1600, 0], [3400, 100], [3700, 100], [4600, 30], [4800, 30], [5800, 100]];
  function compare(st) {
    let pos = 100;
    if (!reduce) for (let k = 1; k < KEYS.length; k++) {
      const [t0, p0] = KEYS[k - 1], [t1, p1] = KEYS[k];
      if (st < t1) { pos = p0 + (p1 - p0) * ease(Math.max(0, st - t0) / (t1 - t0)); break; }
    }
    cmp.style.setProperty('--pos', pos.toFixed(2) + '%');
    cmp.classList.toggle('live', !reduce && st >= 1500 && st < 5850);
  }

  function frame(now) {
    const dt = Math.min(now - last, 100); last = now;
    t += dt;
    if (t >= DUR[cur]) go((cur + 1) % slides.length);
    if (cur === 0) compare(t);
    requestAnimationFrame(frame);
  }

  // Панель предпросмотра
  const pv = document.getElementById('pv');
  function mark(g, v) { pv.querySelectorAll(`[data-g="${g}"] button`).forEach(b => b.classList.toggle('active', b.dataset.v === String(v))); }
  pv.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const g = b.parentElement.dataset.g, v = b.dataset.v;
    if (g === 'lang') setLang(v);
    if (g === 'bg') { root.classList.toggle('light', v === 'light'); mark('bg', v); }
    if (g === 'w') { root.style.setProperty('--pw', v + 'px'); mark('w', v); }
  });
  mark('bg', 'dark'); mark('w', '1100');
  window.banner = { go, seek: ms => { t = ms; } };

  setLang(lang);
  go(0);
  compare(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
